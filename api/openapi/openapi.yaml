openapi: 3.0.3
info:
  title: Cry 088 Worklog API
  version: 1.0.0
  description: Offline-first project time entry, approval and cost analysis API.
servers:
  - url: /api/v1
paths:
  /auth/login:
    post:
      summary: Create access and refresh tokens
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/LoginRequest'}}}
      responses: {'200': {description: Token pair}}
  /auth/refresh:
    post:
      summary: Rotate a refresh token
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RefreshRequest'}}}
      responses: {'200': {description: Token pair}}
  /time-entries:
    post:
      security: [{bearerAuth: []}]
      summary: Save a calendar draft
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/DraftRequest'}}}
      responses: {'201': {description: Draft entry}, '409': {description: Rule conflict}}
  /time-entries/submit:
    post:
      security: [{bearerAuth: []}]
      summary: Submit a batch of drafts
      responses: {'200': {description: Submitted entries}}
  /projects/{projectId}/report:
    get:
      security: [{bearerAuth: []}]
      parameters: [{name: projectId, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Burn and budget report}}
  /calendar/{employeeId}:
    get:
      security: [{bearerAuth: []}]
      parameters: [{name: employeeId, in: path, required: true, schema: {type: string}}, {name: month, in: query, required: true, schema: {type: string, pattern: '^\\d{4}-\\d{2}$'}}]
      responses: {'200': {description: Personal month calendar}}
components:
  securitySchemes: {bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}}
  schemas:
    LoginRequest: {type: object, required: [email, password], properties: {email: {type: string, format: email}, password: {type: string, format: password}}}
    RefreshRequest: {type: object, required: [refresh_token], properties: {refresh_token: {type: string}}}
    DraftRequest: {type: object, required: [organization_id, employee_id, project_id, task_id, work_date, minutes, description], properties: {organization_id: {type: string}, employee_id: {type: string}, project_id: {type: string}, task_id: {type: string}, work_date: {type: string, format: date-time}, start_minute: {type: integer}, minutes: {type: integer, minimum: 1}, description: {type: string, minLength: 3}}}
