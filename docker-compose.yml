services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: worklog
      POSTGRES_USER: worklog
      POSTGRES_PASSWORD: worklog
    volumes: ["pgdata:/var/lib/postgresql/data", "./migrations:/docker-entrypoint-initdb.d:ro"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U worklog -d worklog"], interval: 5s, timeout: 3s, retries: 10}
  app:
    build: .
    environment:
      DATABASE_URL: postgres://worklog:worklog@postgres:5432/worklog?sslmode=disable
      JWT_SECRET: replace-with-at-least-32-random-characters
      WEB_ORIGIN: http://localhost:5173
    depends_on: {postgres: {condition: service_healthy}}
    ports: ["8080:8080"]
volumes: {pgdata: {}}
